services:
  mongo:
    image: mongo:7
    container_name: e-learning-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  rustfs:
    image: rustfs/rustfs:latest
    container_name: e-learning-rustfs
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - rustfs_data:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-elearningfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-elearningfsadmin-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: e-learning-app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/e-learning-msc
      AUTH_SECRET: ${AUTH_SECRET:?AUTH_SECRET must be set}
      AUTH_URL: ${AUTH_URL:?AUTH_URL must be set}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-e-learning-msc}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-elearningfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-elearningfsadmin-secret}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
    depends_on:
      mongo:
        condition: service_healthy
      rustfs:
        condition: service_started

volumes:
  mongodb_data:
  rustfs_data: