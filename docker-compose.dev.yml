services:
  mongo:
    image: mongo:7
    container_name: e-learning-mongo-dev
    restart: unless-stopped
    volumes:
      - mongodb_data_dev:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    ports:
      - "27017:27017"

  rustfs:
    image: rustfs/rustfs:latest
    container_name: e-learning-rustfs-dev
    restart: unless-stopped
    volumes:
      - rustfs_data_dev:/data
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-elearningfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-elearningfsadmin-secret}
      RUSTFS_ADDRESS: ":9000"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_CONSOLE_ENABLE: "true"
    command: ["/data"]
    ports:
      - "9000:9000"
      - "9001:9001"

  mongo-express:
    image: mongo-express:latest
    container_name: e-learning-mongo-express-dev
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_SERVER: mongo
      ME_CONFIG_MONGODB_PORT: "27017"
      ME_CONFIG_MONGODB_ENABLE_ADMIN: "true"
      ME_CONFIG_BASICAUTH: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${ME_USER:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${ME_PASSWORD:-admin}
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${ME_PORT:-8585}:8081"

  nginx:
    image: nginx:alpine
    container_name: e-learning-nginx-dev
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
    volumes:
      - ./nginx/nginx.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app:
        condition: service_healthy

  ollama:
    image: ollama/ollama:latest
    container_name: e-learning-ollama-dev
    restart: unless-stopped
    volumes:
      - ollama_data_dev:/root/.ollama
    environment:
      OLLAMA_HOST: "0.0.0.0:11434"
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'echo > /dev/tcp/localhost/11434'"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: e-learning-app-dev
    restart: unless-stopped
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo:27017/e-learning-msc
      AUTH_SECRET: ${AUTH_SECRET:-dev-secret-change-in-production}
      AUTH_URL: http://localhost
      AUTH_TRUST_HOST: "true"
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      RUSTFS_ENDPOINT: http://rustfs:9000
      RUSTFS_BUCKET: ${RUSTFS_BUCKET:-e-learning-msc}
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-elearningfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-elearningfsadmin-secret}
      RUSTFS_REGION: ${RUSTFS_REGION:-us-east-1}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-phi4-mini}
      AI_PROVIDER: ollama
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    depends_on:
      mongo:
        condition: service_healthy
      rustfs:
        condition: service_started
      ollama:
        condition: service_healthy
    ports:
      - "3000:3000"
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  mongodb_data_dev:
  rustfs_data_dev:
  ollama_data_dev: