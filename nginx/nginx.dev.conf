server_tokens off;

upstream e_learning_app {
    server app:3000;
}

# Next.js dev mode refuses to hydrate client components until its HMR
# WebSocket connects, so the dev proxy must forward upgrades. Only the literal
# "websocket" token is allowed through; any other value (e.g. "h2c") is
# dropped, which is the mitigation recommended for H2C smuggling.
map $http_upgrade $dev_upgrade {
    default "";
    websocket "websocket";
}

map $http_upgrade $dev_connection {
    default "";
    websocket "upgrade";
}

# Development HTTP server (no SSL)
server {
    listen 80;
    listen [::]:80;

    server_name localhost;

    client_max_body_size 50m;

    location / {
        proxy_pass http://e_learning_app;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # nosemgrep: generic.nginx.security.possible-h2c-smuggling.possible-nginx-h2c-smuggling
        proxy_set_header Upgrade $dev_upgrade;
        proxy_set_header Connection $dev_connection;
        proxy_http_version 1.1;

        proxy_read_timeout 60s;
    }
}