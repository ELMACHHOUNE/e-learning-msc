server_tokens off;

upstream e_learning_app {
    server app:3000;
}

# =========================================================
# HTTP - Reject direct IP / unknown hosts
# =========================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    server_tokens off;

    return 444;
}

# =========================================================
# HTTP - Redirect domain to HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name e-teaching.tech www.e-teaching.tech;

    server_tokens off;

    location / {
        return 301 https://e-teaching.tech$request_uri;
    }
}

# =========================================================
# HTTPS - Reject direct IP / unknown hosts
# =========================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/e-teaching.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-teaching.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    return 444;
}

# =========================================================
# HTTPS - Redirect www to canonical domain
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.e-teaching.tech;

    server_tokens off;

    ssl_certificate /etc/letsencrypt/live/e-teaching.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-teaching.tech/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    return 301 https://e-teaching.tech$request_uri;
}

# =========================================================
# HTTPS - Main E-Learning Platform
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name e-teaching.tech;

    # Suppress the nginx version in the "Server" response header.
    server_tokens off;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/e-teaching.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-teaching.tech/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # Maximum upload size
    client_max_body_size 50m;

    # =====================================================
    # Security headers
    #
    # nginx owns the "static" security headers so that each
    # one is emitted exactly once. The Next.js app still
    # emits them (see next.config.ts), so the upstream copies
    # are dropped here with proxy_hide_header to avoid
    # duplicate / conflicting entries (HSTS + X-Frame-Options
    # duplication was flagged by the scanner).
    #
    # NOTE: add_header is never used inside a location block,
    # because that would silently drop every header declared
    # at this level (nginx inheritance rule).
    # =====================================================
    proxy_hide_header Strict-Transport-Security;
    proxy_hide_header X-Frame-Options;
    proxy_hide_header X-Content-Type-Options;
    proxy_hide_header X-XSS-Protection;
    proxy_hide_header Referrer-Policy;
    proxy_hide_header Permissions-Policy;
    proxy_hide_header Cross-Origin-Opener-Policy;
    proxy_hide_header Cross-Origin-Resource-Policy;
    proxy_hide_header X-Permitted-Cross-Domain-Policies;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # Content-Security-Policy is owned by the application (next.config.ts)
    # because it depends on the Next.js runtime and route.

    # =====================================================
    # Shared proxy settings (inherited by every location)
    # =====================================================
    proxy_http_version 1.1;

    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # No WebSocket endpoints exist, so Upgrade/Connection are not forwarded
    # (prevents H2C request smuggling).

    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # =====================================================
    # Trailing slash canonicalisation
    #
    # Next.js answers "/admin/" with a body-less 308 that has
    # no Content-Type. Answer it here instead so the redirect
    # carries a Content-Type header. The capture refuses a
    # leading "//" so this can never emit a protocol-relative
    # (off-site) Location header.
    # =====================================================
    location ~ ^(/[^/].*)/$ {
        return 308 $1$is_args$args;
    }

    # =====================================================
    # Next.js application
    #
    # Cache-Control is left entirely to the application:
    # Next.js already serves /_next/static/* as
    # "public, max-age=31536000, immutable", and adding
    # `expires` here produced a second, conflicting
    # Cache-Control header on every static asset.
    # =====================================================
    location / {
        proxy_pass http://e_learning_app;
    }
}
