upstream e_learning_app {
    server app:3000;
}

# =========================================================
# HTTP - Reject direct IP / unknown hosts
# =========================================================
server {
    listen 80 default_server;
    listen [::]:80 default_server;

    server_name _;

    return 444;
}

# =========================================================
# HTTP - Redirect domain to HTTPS
# =========================================================
server {
    listen 80;
    listen [::]:80;

    server_name e-teaching.tech www.e-teaching.tech;

    location / {
        return 301 https://e-teaching.tech$request_uri;
    }
}

# =========================================================
# HTTPS - Reject direct IP / unknown hosts
# =========================================================
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;

    server_name _;

    ssl_certificate /etc/letsencrypt/live/e-teaching.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-teaching.tech/privkey.pem;

    return 444;
}

# =========================================================
# HTTPS - Redirect www to canonical domain
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name www.e-teaching.tech;

    ssl_certificate /etc/letsencrypt/live/e-teaching.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-teaching.tech/privkey.pem;

    return 301 https://e-teaching.tech$request_uri;
}

# =========================================================
# HTTPS - Main E-Learning Platform
# =========================================================
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;

    server_name e-teaching.tech;

    # SSL certificates
    ssl_certificate /etc/letsencrypt/live/e-teaching.tech/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/e-teaching.tech/privkey.pem;

    # Modern SSL configuration
    ssl_protocols TLSv1.2 TLSv1.3;

    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;

    ssl_prefer_server_ciphers off;

    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # =====================================================
    # Security headers
    # =====================================================
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Maximum upload size
    client_max_body_size 50m;

    # =====================================================
    # Next.js application
    # =====================================================
    location / {
        proxy_pass http://e_learning_app;

        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket / Next.js support
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # =====================================================
    # Next.js static assets
    # =====================================================
    location /_next/static/ {
        proxy_pass http://e_learning_app;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # =====================================================
    # Images
    # =====================================================
    location /images/ {
        proxy_pass http://e_learning_app;

        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
